name: Auto Tech News to Telegram

on:
  schedule:
    - cron: '0 23 * * *' # 06 WIB
    - cron: '0 5 * * *'  # 12 WIB
    - cron: '0 10 * * *' # 17 WIB
    - cron: '0 14 * * *' # 21 WIB
    - cron: '0 21 * * *' # 04 WIB
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Fetch & Parse RSS (FIXED)
        run: |
          curl -s "https://hnrss.org/frontpage" | \
          awk '
          /<item>/ {in_item=1; title=""; link=""}
          /<\/item>/ {
            if (title != "" && link != "") {
              print "🔥 " title "\n" link "\n"
            }
            in_item=0
          }
          in_item && /<title>/ {
            gsub(/.*<title>|<\/title>.*/, "", $0)
            title=$0
          }
          in_item && /<link>/ {
            gsub(/.*<link>|<\/link>.*/, "", $0)
            link=$0
          }
          ' | head -n 20 > news.txt

      - name: Limit size (anti error Telegram)
        run: head -c 3500 news.txt > final.txt

      - name: Send to Telegram
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.CHAT_ID }}" \
          -d "text=$(cat final.txt)"