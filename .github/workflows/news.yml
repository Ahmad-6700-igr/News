name: ZIYAD AI DAILY INTEL

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-intel:
    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep sed gawk coreutils

      ###################################################
      # FETCH NEWS
      ###################################################

      - name: Fetch Hacker News RSS
        run: |
          curl -s "https://hnrss.org/frontpage" > ai.xml

      ###################################################
      # EXTRACT TITLES + LINKS
      ###################################################

      - name: Extract titles and links
        run: |
          grep -oP '(?<=<title>).*?(?=</title>)' ai.xml \
          | tail -n +2 \
          | sed 's/<!\[CDATA\[//g; s/\]\]>//g' > ai_titles.txt

          grep -oP '(?<=<link>).*?(?=</link>)' ai.xml \
          | tail -n +2 > ai_links.txt

          paste -d '|' ai_titles.txt ai_links.txt > ai_combined.txt

      ###################################################
      # FILTER NEWS
      ###################################################

      - name: Filter AI News
        run: |
          grep -iE "openai|google|gemini|anthropic|claude|deepseek|nvidia|meta|microsoft|ai|gpt|llm|agent|automation|developer|coding|github|python|javascript" ai_combined.txt | \
          grep -ivE "job|jobs|career|hiring|vacancy|internship|remote" > ai_filtered.txt || true

      ###################################################
      # FALLBACK
      ###################################################

      - name: Fallback if empty
        run: |
          if [ ! -s ai_filtered.txt ]; then
            cp ai_combined.txt ai_filtered.txt
          fi

      ###################################################
      # RANK BEST NEWS
      ###################################################

      - name: Rank Best News
        run: |
          awk -F '|' '
          {
            score=0
            title=tolower($1)

            if (title ~ /openai|google|anthropic|nvidia|deepseek|meta|microsoft/) score+=6
            if (title ~ /gpt|gemini|claude|llm|agent|ai/) score+=5
            if (title ~ /launch|release|breaking|update|future|new/) score+=4
            if (title ~ /developer|coding|github|python|javascript/) score+=2
            if (length($1) > 55) score+=1

            print score "|" $0
          }' ai_filtered.txt | sort -t'|' -nr | head -n 1 > best_ai.txt

      ###################################################
      # FETCH GITHUB TRENDING
      ###################################################

      - name: Fetch GitHub Trending
        run: |
          curl -s https://github.com/trending > trending.html

      ###################################################
      # EXTRACT REPOSITORY
      ###################################################

      - name: Extract Repository
        run: |
          grep -oP '/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' trending.html | \
          grep -iE "ai|agent|gpt|llm|bot|automation|python|javascript" | \
          head -n 1 > repo.txt || true

      ###################################################
      # REPOSITORY FALLBACK
      ###################################################

      - name: Repository fallback
        run: |
          if [ ! -s repo.txt ]; then
            echo "/microsoft/markitdown" > repo.txt
          fi

      ###################################################
      # COURSE
      ###################################################

      - name: Create course
        run: |
          echo "https://www.deeplearning.ai/short-courses/" > course.txt

      ###################################################
      # SEND AI NEWS
      ###################################################

      - name: Send AI News
        run: |
          AI_TITLE=$(cut -d '|' -f2 best_ai.txt)
          AI_LINK=$(cut -d '|' -f3 best_ai.txt)

          TEXT=$(printf "🚀 ZIYAD AI NEWS\n\n📰 AI HYPE NEWS\n\n🔥 %s\n\n🧠 Berita ini sedang ramai dibahas secara global dan berpotensi memengaruhi dunia AI.\n\n🔗 %s\n\n💬 Reply pesan ini untuk bertanya ke AI tentang berita ini." "$AI_TITLE" "$AI_LINK")

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d chat_id=${{ secrets.CHAT_ID }} \
          --data-urlencode text="$TEXT"

      ###################################################
      # SEND GITHUB REPO
      ###################################################

      - name: Send GitHub Repo
        run: |
          REPO=$(cat repo.txt)

          TEXT=$(printf "💻 ZIYAD GITHUB TRENDING\n\n⭐ https://github.com%s\n\n🛠 Repository ini sedang menarik perhatian komunitas AI dan developer.\n\n💬 Reply pesan ini untuk bertanya ke AI tentang repository ini." "$REPO")

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d chat_id=${{ secrets.CHAT_ID }} \
          --data-urlencode text="$TEXT"

      ###################################################
      # SEND COURSE
      ###################################################

      - name: Send Free AI Course
        run: |
          COURSE=$(cat course.txt)

          TEXT=$(printf "🎓 FREE AI COURSE\n\n📚 %s\n\n🚀 Belajar AI langsung dari platform terpercaya secara gratis.\n\n💬 Reply pesan ini untuk bertanya ke AI tentang course ini." "$COURSE")

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d chat_id=${{ secrets.CHAT_ID }} \
          --data-urlencode text="$TEXT"