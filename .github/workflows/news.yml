name: Auto Tech News to Telegram with ziyad 

on:
  schedule:
    - cron: '0 23 * * *' # 06 WIB
    - cron: '0 5 * * *'  # 12 WIB
    - cron: '0 10 * * *' # 17 WIB
    - cron: '0 14 * * *' # 21 WIB
    - cron: '0 21 * * *' # 04 WIB
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Fetch & Format News
        run: |
          curl -s "https://hnrss.org/frontpage" | \
          awk -F'[<>]' '
          /<title>/ {title=$3}
          /<link>/ {
            link=$3
            if (title != "Hacker News") {
              print "🔥 " title "\n" link "\n"
            }
          }' | head -n 20 > news.txt

      - name: Limit size (anti error Telegram)
        run: head -c 3500 news.txt > final.txt

      - name: Send to Telegram
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.CHAT_ID }}" \
          -d "text=$(cat final.txt)"
