name: Smart Viral Tech News

on:
  schedule:
    - cron: '0 22 * * 0' # Minggu (Senin pagi WIB)
    - cron: '0 22 * * 2' # Selasa (Rabu pagi WIB)
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl grep coreutils

      - name: Fetch RSS
        run: curl -s https://hnrss.org/frontpage > rss.xml

      - name: Parse + Filter + Select BEST
        run: |
          grep -oP '(?<=<title>).*?(?=</title>)' rss.xml | \
          tail -n +2 | sed 's/<!\[CDATA\[//g; s/\]\]>//g' > titles.txt

          grep -oP '(?<=<link>).*?(?=</link>)' rss.xml | \
          tail -n +2 > links.txt

          paste -d '|' titles.txt links.txt | \
          grep -iE "ai|artificial intelligence|machine learning|coding|developer|programming|android|software|github|python|javascript" > filtered.txt

          # Ranking sederhana berdasarkan keyword kuat
          awk -F '|' '
          {
            score=0
            if (tolower($1) ~ /ai|launch|release|new|agent|gpt/) score+=3
            if (tolower($1) ~ /developer|coding|programming/) score+=2
            if (length($1) > 60) score+=1
            print score "|" $0
          }' filtered.txt | sort -t'|' -nr | head -n 1 > best.txt

      - name: Format Output (WITH SUMMARY)
        run: |
          TITLE=$(cut -d '|' -f2 best.txt)
          LINK=$(cut -d '|' -f3 best.txt)

          echo "🚀 ZIYAD TECH INSIGHT" > news.txt
          echo "" >> news.txt

          echo "🔥 $TITLE" >> news.txt
          echo "" >> news.txt

          echo "🧠 Ringkasan:" >> news.txt
          echo "Teknologi ini lagi ramai dibahas karena punya potensi besar di dunia AI dan developer. Bisa berdampak ke cara orang coding dan membangun produk." >> news.txt
          echo "" >> news.txt

          echo "🔗 $LINK" >> news.txt

      - name: Debug
        run: cat news.txt

      - name: Send to Telegram
        run: |
          TEXT=$(cat news.txt)

          if [ -n "$TEXT" ]; then
            curl -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.CHAT_ID }} \
            --data-urlencode text="$TEXT"
          else
            echo "Tidak ada berita"
          fi