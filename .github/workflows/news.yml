name: ZIYAD AI HYPE NEWS

on:
  schedule:
    # 07:00 WIB setiap hari
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    concurrency:
      group: ziyad-ai-news
      cancel-in-progress: true

    steps:

      ###################################################
      # INSTALL TOOLS
      ###################################################

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl grep sed gawk coreutils

      ###################################################
      # FETCH HACKER NEWS RSS
      ###################################################

      - name: Fetch Hacker News RSS
        run: |
          curl -s "https://hnrss.org/frontpage" > ai.xml

      ###################################################
      # EXTRACT TITLES + LINKS
      ###################################################

      - name: Extract titles and links
        run: |
          grep -oP '(?<=<title>).*?(?=</title>)' ai.xml \
          | tail -n +2 \
          | sed 's/<!\[CDATA\[//g; s/\]\]>//g' > ai_titles.txt

          grep -oP '(?<=<link>).*?(?=</link>)' ai.xml \
          | tail -n +2 > ai_links.txt

          paste -d '|' ai_titles.txt ai_links.txt > ai_combined.txt

      ###################################################
      # FILTER AI NEWS
      ###################################################

      - name: Filter AI News
        run: |
          grep -iE "openai|google|gemini|anthropic|claude|deepseek|nvidia|meta|microsoft|ai|gpt|llm|agent|automation|robotics|developer|coding|programming|github|python|javascript" ai_combined.txt | \
          grep -ivE "job|jobs|career|hiring|vacancy|internship|remote|sponsor" > ai_filtered.txt || true

      ###################################################
      # FALLBACK
      ###################################################

      - name: Fallback if empty
        run: |
          if [ ! -s ai_filtered.txt ]; then
            cp ai_combined.txt ai_filtered.txt
          fi

      ###################################################
      # RANK BEST NEWS
      ###################################################

      - name: Rank Best News
        run: |
          awk -F '|' '
          {
            score=0
            title=tolower($1)

            # Big AI companies
            if (title ~ /openai|google|anthropic|nvidia|deepseek|meta|microsoft/) score+=6

            # AI keywords
            if (title ~ /gpt|gemini|claude|llm|agent|ai/) score+=5

            # Hype keywords
            if (title ~ /launch|release|breaking|future|update|new/) score+=4

            # Dev keywords
            if (title ~ /developer|coding|github|python|javascript/) score+=2

            # Long title bonus
            if (length($1) > 55) score+=1

            # Penalti lowongan kerja
            if (title ~ /job|jobs|career|hiring|vacancy/) score-=10

            print score "|" $0
          }' ai_filtered.txt | sort -t'|' -nr | head -n 2 > best_ai.txt

      ###################################################
      # SEND NEWS 1
      ###################################################

      - name: Send First AI News
        run: |
          LINE=$(sed -n '1p' best_ai.txt)

          TITLE=$(echo "$LINE" | cut -d '|' -f2)
          LINK=$(echo "$LINE" | cut -d '|' -f3)

          if [ -n "$TITLE" ]; then

            TEXT=$(printf "📰 AI HYPE NEWS\n\n🔥 %s\n\n🧠 Berita ini sedang ramai dibahas secara global dan berpotensi memengaruhi dunia AI.\n\n🔗 %s\n\n💬 Reply pesan ini untuk bertanya ke AI tentang berita ini." "$TITLE" "$LINK")

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.CHAT_ID }} \
            --data-urlencode text="$TEXT"

          fi

      ###################################################
      # SEND NEWS 2
      ###################################################

      - name: Send Second AI News
        run: |
          LINE=$(sed -n '2p' best_ai.txt)

          TITLE=$(echo "$LINE" | cut -d '|' -f2)
          LINK=$(echo "$LINE" | cut -d '|' -f3)

          if [ -n "$TITLE" ]; then

            TEXT=$(printf "📰 AI HYPE NEWS\n\n🔥 %s\n\n🧠 Berita ini sedang ramai dibahas secara global dan berpotensi memengaruhi dunia AI.\n\n🔗 %s\n\n💬 Reply pesan ini untuk bertanya ke AI tentang berita ini." "$TITLE" "$LINK")

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.CHAT_ID }} \
            --data-urlencode text="$TEXT"

          fi