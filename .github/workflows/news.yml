name: Filtered Tech News to Telegram

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl grep coreutils

      - name: Fetch RSS
        run: |
          curl -s https://hnrss.org/frontpage > rss.xml

      - name: Parse + Filter (FINAL)
        run: |
          # Ambil judul dan bersihin CDATA
          grep -oP '(?<=<title>).*?(?=</title>)' rss.xml | \
          tail -n +2 | \
          sed 's/<!\[CDATA\[//g; s/\]\]>//g' > titles.txt

          # Ambil link
          grep -oP '(?<=<link>).*?(?=</link>)' rss.xml | \
          tail -n +2 > links.txt

          # Gabung + filter ketat
          paste -d '|' titles.txt links.txt | \
          grep -iE "ai|artificial intelligence|machine learning|coding|developer|programming|android|software|github|python|javascript" | \
          grep -viE "politics|war|crime|celebrity|bitcoin scam" | \
          head -n 10 | \
          awk -F '|' '{print "🔥 " $1 "\n" $2 "\n"}' > news.txt

      - name: Debug hasil
        run: cat news.txt

      - name: Send to Telegram
        run: |
          TEXT=$(cat news.txt)

          if [ -n "$TEXT" ]; then
            curl -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.CHAT_ID }} \
            --data-urlencode text="$TEXT"
          else
            echo "Tidak ada berita relevan hari ini"
          fi